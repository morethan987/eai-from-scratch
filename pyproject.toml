[project]
name = "vla-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "morethan987", email = "2404385626@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "gymnasium>=1.4.0",
    "imageio[ffmpeg]>=2.38.1",
    "metaworld>=3.1.1",
    "mujoco>=3.3.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "tyro>=1.0.16",
]

[project.scripts]
vla-from-scratch = "vla_from_scratch:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ty.rules]
invalid-mutable-override = "ignore"
