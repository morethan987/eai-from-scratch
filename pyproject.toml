[project]
name = "eai-from-scratch"
version = "0.1.0"
description = "Embodied AI from Scratch (EAI-336): Foundations, Architectures, Scaling, and Systems for Generalist Robot Policies"
readme = "README.md"
authors = [
    { name = "morethan987", email = "2404385626@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "gymnasium>=1.4.0",
    "imageio[ffmpeg]>=2.38.1",
    "metaworld>=3.1.1",
    "mujoco>=3.3.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "tyro>=1.0.16",
]

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "rust-just>=1.59.0",
    "ty>=0.0.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eai336"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-rfEs --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ty.rules]
invalid-mutable-override = "ignore"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]
